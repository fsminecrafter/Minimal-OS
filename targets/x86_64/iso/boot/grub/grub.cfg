set timeout=3
set default=0

insmod all_video
if loadfont ${prefix}/fonts/unicode.pf2; then
	insmod gfxterm
	set gfxmode=auto
	set gfxpayload=keep
	terminal_output gfxterm
fi

menuentry "Minimal-OS" {
	multiboot2 /boot/kernel.bin
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	boot
}

menuentry "Minimal-OS (Debug)" {
	multiboot2 /boot/kernel.bin --debug
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	boot
}

menuentry "Minimal-OS Memory Tester x64" {
	multiboot2 /boot/kernel.bin memtest
	boot
}

menuentry "Minimal-OS (No Disk)" {
	multiboot2 /boot/kernel.bin no-disk
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	boot
}
