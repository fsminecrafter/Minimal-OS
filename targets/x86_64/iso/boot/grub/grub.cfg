set timeout=3
set default=0

insmod all_video
if loadfont ${prefix}/fonts/unicode.pf2; then
	insmod gfxterm
	set gfxmode=auto
	set gfxpayload=keep
	terminal_output gfxterm
fi

menuentry "Minimal-OS" {
	multiboot2 /boot/kernel.bin
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}

menuentry "Minimal-OS (Debug)" {
	multiboot2 /boot/kernel.bin --debug
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}

menuentry "Minimal-OS Memory Tester x64" {
	multiboot2 /boot/kernel.bin memtest
	boot
}

menuentry "Minimal-OS (No Disk)" {
	multiboot2 /boot/kernel.bin no-disk
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}

# RamFS with the previous (immediate, one barrier per draw) CPU rasterizer
# (the 'fgpuold' boot flag), for comparing renderings with the binned path.
# Kept above the noavx entry so that GRUB_UP=1 still reaches noavx:
# tools/debug/ci_fglcube.sh reaches this one with GRUB_UP=2.
menuentry "Minimal-OS (RamFS, fgpuold)" {
	if [ -f /boot/mosfirmware.mpkg ]; then
		if [ -f /boot/mosgames.mpkg ]; then
			multiboot2 /boot/kernel.bin ramfs=256 fgpuold
		else
			multiboot2 /boot/kernel.bin ramfs=192 fgpuold
		fi
	elif [ -f /boot/mosgames.mpkg ]; then
		multiboot2 /boot/kernel.bin ramfs=128 fgpuold
	else
		multiboot2 /boot/kernel.bin ramfs fgpuold
	fi
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}

# RamFS with the SSE-only fallback: no XSAVE/AVX, state saved with fxsave
# (the 'noavx' boot flag). Kept ABOVE the RamFS entry: tools/debug/ci_os0.sh
# picks the LAST entry for its normal run and reaches this one with GRUB_UP=1.
menuentry "Minimal-OS (RamFS, noavx)" {
	if [ -f /boot/mosfirmware.mpkg ]; then
		if [ -f /boot/mosgames.mpkg ]; then
			multiboot2 /boot/kernel.bin ramfs=256 noavx
		else
			multiboot2 /boot/kernel.bin ramfs=192 noavx
		fi
	elif [ -f /boot/mosgames.mpkg ]; then
		multiboot2 /boot/kernel.bin ramfs=128 noavx
	else
		multiboot2 /boot/kernel.bin ramfs noavx
	fi
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}

# Everything runs from a RAM disk; real disks are never touched.
# Size: ramfs=<MiB> (default 64; 192 with GPU firmware on the ISO, 128 with
# the games of 'make mosdesk-doom', 256 with both).
menuentry "Minimal-OS (RamFS)" {
	if [ -f /boot/mosfirmware.mpkg ]; then
		if [ -f /boot/mosgames.mpkg ]; then
			multiboot2 /boot/kernel.bin ramfs=256
		else
			multiboot2 /boot/kernel.bin ramfs=192
		fi
	elif [ -f /boot/mosgames.mpkg ]; then
		multiboot2 /boot/kernel.bin ramfs=128
	else
		multiboot2 /boot/kernel.bin ramfs
	fi
	module2 /boot/kernel.bin moskernel
	module2 /boot/mosinst.mpkg mosinst
	if [ -f /boot/mosfirmware.mpkg ]; then module2 /boot/mosfirmware.mpkg mosfirmware; fi
	if [ -f /boot/mosgames.mpkg ]; then module2 /boot/mosgames.mpkg mosgames; fi
	boot
}
