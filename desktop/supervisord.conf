[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/novnc/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1600x900x24 -nolisten tcp -ac
autorestart=true
priority=10
startsecs=2

[program:xfce]
command=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
user=desktop
environment=DISPLAY=":0",HOME="/home/desktop",USER="desktop",LOGNAME="desktop"
autorestart=true
priority=20
startsecs=5

[program:x11vnc]
command=/usr/bin/x11vnc -display :0 -rfbport 5900 -localhost -forever -shared -rfbauth /run/novnc/passwd
autorestart=true
priority=30
startsecs=2

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
startsecs=2
